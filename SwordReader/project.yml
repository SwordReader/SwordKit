name: SwordReader
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  SwordKit:
    url: https://github.com/orbeavers14/SwordKit.git
    exactVersion: 0.1.0
targetTemplates:
  SwordReaderApp:
    type: application
    sources:
      - path: SwordReader
    dependencies:
      - package: SwordKit
        product: SwordKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: Support/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: SwordReader
        UILaunchScreen: {}
        NSHumanReadableCopyright: "SwordReader is licensed under GPL-2.0-only. Bible modules have separate licenses."
targets:
  SwordReader:
    templates: [SwordReaderApp]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SwordReader
        SUPPORTS_MACCATALYST: NO
  SwordReaderMac:
    templates: [SwordReaderApp]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SwordReader.mac
  SwordReaderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SwordReaderTests
    dependencies:
      - target: SwordReaderMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.SwordReaderTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 6.0
schemes:
  SwordReader:
    build:
      targets:
        SwordReader: all
    run:
      config: Debug
  SwordReader-macOS:
    build:
      targets:
        SwordReaderMac: all
        SwordReaderTests: [test]
    run:
      config: Debug
    test:
      gatherCoverageData: true
      targets:
        - SwordReaderTests
